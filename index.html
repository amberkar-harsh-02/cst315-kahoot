<!DOCTYPE html>
<html>
<head>
    <title>CSUMB Kahoot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- JOIN SCREEN -->
    <div id="join_screen" class="screen">
        <h2>Join CST 315 Quiz</h2>
        <input type="text" id="room_code_input" placeholder="6-Digit Game PIN" maxlength="6">
        <input type="text" id="student_name_input" placeholder="Your Name">
        <button id="join_btn" onclick="joinGame()">Enter</button>
        <p id="join_error" style="color: red;"></p>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby_screen" class="screen" style="display: none;">
        <h2>You're in!</h2>
        <p>See your nickname on the projector.</p>
        <p>Waiting for the Instructor to start...</p>
    </div>

    <!-- GAME SCREEN (Your partner's layout, modified with IDs) -->
    <div id="game_screen" class="screen" style="display: none;">
        <div id="question_banner">Waiting for question...</div>

        <div id="center">
            <img src="./Images/csumb.webp" alt="CSUMB Logo">
        </div>

        <div id="button_container">
            <div class="button_column">
                <button class="button" id="btn_red" style="background-color: red;" onclick="submitAnswer('red')">
                    <img src="./Images/triangle.png">
                    <span id="text_red">Response 1</span>
                </button>
                <!-- Changed orange to yellow to match backend -->
                <button class="button" id="btn_yellow" style="background-color: #ffc107;" onclick="submitAnswer('yellow')">
                    <img src="./Images/circle.png">
                    <span id="text_yellow">Response 2</span>
                </button>
            </div>
            <div class="button_column">
                <button class="button" id="btn_blue" style="background-color: blue;" onclick="submitAnswer('blue')">
                    <img src="./Images/square.png">
                    <span id="text_blue">Response 3</span>
                </button>
                <button class="button" id="btn_green" style="background-color: green;" onclick="submitAnswer('green')">
                    <!-- Partner used triangle again here, leaving as is -->
                    <img src="./Images/triangle.png"> 
                    <span id="text_green">Response 4</span>
                </button>
            </div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end_screen" class="screen" style="display: none;">
        <h2>Game Over!</h2>
        <h3 id="final_score_display">Calculating score...</h3>
        <!-- We will wire this to the CSV receipt generator later -->
        <button id="download_receipt_btn" style="display: none;">Download Canvas Receipt</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!doctype html>

<html>
  <head>
    <title>CSUMB Kahoot</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Dongle&family=Permanent+Marker&display=swap");
    </style>
  </head>

  <body>
    <div id="question_banner" class="permanent-marker-regular">Question</div>
    <div id="center-container">
      <div class="side-of-image">
        <img src=".././Images/purple-circle.png" id="side-circle-left">
        <span id="timer">25</span>
      </div>
      <img src=".././Images/csumb.webp" />
      <div id="submited-questions-container">
        <div id="submited-questions-counter">10</div>
        <div id="submited-questions-text">Questions Submitted</div>
      </div>
    </div>

    <div id="button_container">
        
      <div class="button_column">
        <button class="button" style="background-color: red">
          <img src=".././Images/triangle.png" />
          <span>Response 1</span>
        </button>

        <button class="button" style="background-color: orange">
          <img src=".././Images/circle.png" />
          <span>Response 2</span>
        </button>
      </div>

      <div class="button_column">
        <button class="button" style="background-color: blue">
          <img src=".././Images/square.png" />
          <span>Response 3</span>
        </button>
        <button class="button" style="background-color: green">
          <img src=".././Images/star.png" />
          <span>Response 4</span>
        </button>
      </div>
    </div>
  </body>
</html>

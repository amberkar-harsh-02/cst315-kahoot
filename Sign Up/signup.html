<!doctype html>

<html>
  <head>
    <title>CSUMB Kahoot</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Dongle&family");
    </style>
    <link rel="stylesheet" href="style_signup.css" />
  </head>

  <body>
    <button id="CSUMB_signin">CSUMB Log In</button>

    <form>
      <h1>CSUMB Kahoot</h1>

      <label for="pin">Game PIN</label>
      <input id="pin" type="number" placeholder="Enter PIN" />

      <label for="name">Player name</label>
      <input id="name" type="text" placeholder="Enter name" />

      <button type="submit">Join Game</button>
    </form>
  </body>
</html>
